<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ergogen Outline Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="window-title">OUTLINE_STUDIO.EXE</span>
                <button id="btnRenderBase" class="btn btn-primary">RUN</button>
            </div>

            <!-- Base YAML -->
            <div class="panel-section flex-grow">
                <textarea id="inputYAML" spellcheck="false" placeholder="Paste Ergogen YAML..."></textarea>
            </div>

            <!-- Output YAML-->
            <div class="panel-section flex-grow">
                <div class="inline-toolbar">
                    <button id="btnCopy" class="btn btn-text">COPY</button>
                </div>
                <textarea id="outputYAML" spellcheck="false" readonly></textarea>
            </div>

            <!-- Controls Footer -->
            <div class="panel-footer">
                <div class="control-group">
                    <div class="label-row">
                        <span>FILLET</span>
                        <span id="filletValDisplay">0</span>
                    </div>
                    <input type="range" id="filletSlider" min="0" max="10" step="0.5" value="0">
                </div>
                <div class="action-buttons">
                    <button id="btnUndo" class="btn">UNDO</button>
                    <button id="btnClear" class="btn btn-danger-subtle">CLEAR</button>
                </div>
                
                <!-- Error Log hidden by default, toggled via button -->
                <div class="status-container">
                    <button id="btnToggleLog" class="btn btn-text">[LOG: OFF]</button>
                    <div id="errorLog" class="status-bar" style="display: none;">READY</div>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="canvas-workspace">
            <canvas id="canvas"></canvas>
            
            <!-- Hideable Hint Icon -->
            <div class="hint-container">
                <button id="btnToggleHints" class="btn-icon">?</button>
                <div id="canvasHintBox" class="canvas-hint" style="display: none;">
                    <span>CLICK: Add Vertex</span>
                    <span>SHIFT+CLICK: Arc</span>
                    <span>DRAG: Move</span>
                    <span>SPACE+DRAG: Pan</span>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        // Simple UI toggles for hidden elements, why not combine it in app.js idk add it to the TODO
        document.getElementById('btnToggleHints').addEventListener('click', () => {
            const box = document.getElementById('canvasHintBox');
            box.style.display = box.style.display === 'none' ? 'flex' : 'none';
        });

        document.getElementById('btnToggleLog').addEventListener('click', () => {
            const log = document.getElementById('errorLog');
            const btn = document.getElementById('btnToggleLog');
            if (log.style.display === 'none') {
                log.style.display = 'block';
                btn.innerText = '[LOG: ON]';
            } else {
                log.style.display = 'none';
                btn.innerText = '[LOG: OFF]';
            }
        });
    </script>
</body>
</html>
